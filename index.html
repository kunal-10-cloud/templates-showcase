<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emergent Template Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one deliberate dark world. Animated contour field behind a catalog of live-window cards; two featured templates on top. */
:root {
  color-scheme: dark;
  --bg: #0A0C10; --bg-2: #0F1218; --panel: #12161D; --panel-2: #171C25; --line: #232A35; --line-2: #2E3644;
  --ink: #EEF1F5; --ink-2: #A9B1BE; --ink-3: #6F7887;
  --accent: #FF6A21; --accent-2: #FF9A5C; --accent-soft: rgba(255,106,33,.14);
  --live: #3DDC97;
  --f-display: "Bricolage Grotesque", "Instrument Sans", "Helvetica Neue", sans-serif;
  --f-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }

#field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(520px 380px at var(--mx, 70%) var(--my, 20%), rgba(255,122,61,.22), transparent 70%); transition: background .2s; }
.aurora { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(70px) saturate(140%); opacity: .75; }
.aurora i { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
.aurora .a1 { width: 55vw; height: 55vw; left: 5%; top: 0%; background: radial-gradient(circle, rgba(255,106,33,.55), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
.aurora .a2 { width: 50vw; height: 50vw; right: 0%; top: 10%; background: radial-gradient(circle, rgba(124,92,255,.50), transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
.aurora .a3 { width: 45vw; height: 45vw; left: 30%; bottom: -5%; background: radial-gradient(circle, rgba(32,201,170,.40), transparent 65%); animation: drift3 28s ease-in-out infinite alternate; }
.aurora .a4 { width: 35vw; height: 35vw; right: 20%; bottom: 10%; background: radial-gradient(circle, rgba(255,72,140,.35), transparent 65%); animation: drift4 36s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18vw, 22vh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-22vw, 18vh) scale(.9); } }
@keyframes drift3 { to { transform: translate(-14vw, -24vh) scale(1.2); } }
@keyframes drift4 { to { transform: translate(16vw, -16vh) scale(1.1); } }
.dots { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1.2px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%); mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%); }
.wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding-inline: 20px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.mark { display: flex; align-items: center; gap: 10px; font: 700 17px var(--f-display); letter-spacing: -.01em; }
.mark .lg-word { height: 20px; width: auto; color: var(--ink); display: block; }
.mark-sep { width: 1px; height: 18px; background: var(--line-2); }
.mark span:last-child { color: var(--ink-2); font-weight: 600; }
.top nav { display: flex; gap: 6px; flex-wrap: wrap; }
.top nav a { font-size: 13px; color: var(--ink-2); padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; }
.top nav a:hover { border-color: var(--line-2); color: var(--ink); }

/* hero */
.hero { padding-block: 40px 36px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 48px; align-items: center; }
.eyebrow { font: 600 12px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--accent); }
.hero h1 { font: 800 clamp(40px, 6.4vw, 84px)/0.98 var(--f-display); letter-spacing: -.035em; margin-top: 18px; }
.hero h1 em { font-style: normal; background: linear-gradient(100deg, var(--accent) 10%, var(--accent-2) 60%, #FFD2B0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lede { margin-top: 20px; font-size: 18px; color: var(--ink-2); max-width: 56ch; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.stat { background: rgba(18,22,29,.82); backdrop-filter: blur(8px); padding: 18px 20px; }
.stat b { display: block; font: 700 32px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-3); }

/* featured */
.section-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 28px 0 16px; flex-wrap: wrap; }
.section-h h2 { font: 700 26px var(--f-display); letter-spacing: -.02em; }
.section-h p { color: var(--ink-3); font-size: 14px; }
.featured { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

.card { position: relative; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(23,28,37,.92), rgba(15,18,24,.92)); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .35s; transform-style: preserve-3d; text-align: left; padding: 0; width: 100%; }
.card.live { border-color: rgba(255,106,33,.35); box-shadow: 0 0 0 1px rgba(255,106,33,.12), 0 30px 80px rgba(255,106,33,.10); }
.card.live::after { content: ""; position: absolute; inset: -1px; border-radius: 22px; padding: 1px; background: conic-gradient(from var(--ang, 0deg), transparent 0 70%, var(--accent) 80%, transparent 90%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 6s linear infinite; pointer-events: none; }
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --ang: 360deg; } }

/* the window (preview) */
.win { margin: 14px 14px 0; border-radius: 14px; border: 1px solid var(--line-2); background: #0C0F14; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; display: flex; flex-direction: column; position: relative; }
.featured .win { aspect-ratio: 16 / 9; }
.chrome { height: 26px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: #151A22; border-bottom: 1px solid var(--line); }
.chrome i { width: 8px; height: 8px; border-radius: 50%; background: #2E3644; }
.chrome .url .lg-mark { width: 9px; height: 9px; display: inline-block; vertical-align: -1px; margin-right: 5px; color: var(--ink-2); }
.chrome .url { margin-left: 8px; flex: 1; min-width: 0; height: 15px; border-radius: 5px; background: #0E1218; font: 500 9.5px/15px var(--f-mono); color: var(--ink-3); padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app { flex: 1; display: grid; grid-template-columns: 18% minmax(0,1fr); min-height: 0; }
.sb { background: #10141B; border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 7px; }
.sb .lg { width: 16px; height: 16px; border-radius: 5px; background: var(--c); margin-bottom: 6px; }
.sb span { height: 5px; border-radius: 3px; background: #252C38; }
.sb span.on { background: var(--c); opacity: .9; }
.cv { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; overflow: hidden; }
.kp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kp div { background: #161B24; border: 1px solid #1F2631; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.kp b { height: 6px; width: 60%; border-radius: 3px; background: var(--c); opacity: .85; }
.kp s { height: 4px; width: 85%; border-radius: 2px; background: #2A3240; text-decoration: none; }
.body { flex: 1; min-height: 0; display: flex; gap: 8px; }
.pane { background: #141922; border: 1px solid #1F2631; border-radius: 8px; flex: 1; min-width: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
.ln { height: 5px; border-radius: 3px; background: #262E3B; }
.ln.c { background: var(--c); opacity: .7; }
.rowx { display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.chipx { height: 8px; width: 22px; border-radius: 4px; background: var(--c); opacity: .35; flex: none; }
/* preview kinds */
.bars { flex: 1; display: flex; align-items: flex-end; gap: 4px; }
.bars i { flex: 1; background: linear-gradient(180deg, var(--c), transparent); border-radius: 3px 3px 0 0; transform-origin: bottom; animation: grow 3.6s ease-in-out infinite; }
@keyframes grow { 0%,100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
.kan { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kan > div { background: #11161E; border-radius: 6px; padding: 5px; display: flex; flex-direction: column; gap: 5px; }
.kan .t { height: 18px; border-radius: 4px; background: #1D2430; border-left: 2px solid var(--c); }
.kan .t.mv { animation: hop 5s ease-in-out infinite; }
@keyframes hop { 0%,40% { transform: translateX(0); } 50%,90% { transform: translateX(calc(100% + 11px)); } 100% { transform: translateX(0); } }
.cal { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 3px; }
.cal i { background: #11161E; border-radius: 3px; }
.cal i.f { background: var(--c); opacity: .55; animation: blink 4s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: .75; } }
.map { flex: 1; border-radius: 6px; background:
  linear-gradient(90deg, transparent 47%, #202836 47% 53%, transparent 53%),
  linear-gradient(0deg, transparent 58%, #202836 58% 63%, transparent 63%),
  linear-gradient(30deg, transparent 70%, #1A2230 70% 74%, transparent 74%), #10151C; position: relative; }
.map .pin { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px rgba(255,255,255,.04), 0 0 12px var(--c); }
.map .pin.go { animation: drive 7s ease-in-out infinite; }
@keyframes drive { 0% { left: 12%; top: 60%; } 35% { left: 49%; top: 60%; } 65% { left: 49%; top: 22%; } 100% { left: 12%; top: 60%; } }
.tbl .rowx { padding: 3px 0; border-bottom: 1px solid #1C232E; }
.tbl .rowx:nth-child(3) { animation: hl 5s ease-in-out infinite; }
@keyframes hl { 0%,60%,100% { background: transparent; } 70%,90% { background: rgba(255,255,255,.04); } }
.grid6 { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.grid6 > div { background: #11161E; border-radius: 5px; display: flex; flex-direction: column; overflow: hidden; }
.grid6 > div b { flex: 1; background: linear-gradient(135deg, #1D2431, #151B25); }
.grid6 > div s { height: 5px; margin: 4px; border-radius: 3px; background: var(--c); opacity: .6; text-decoration: none; }
.ring { width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--c) 0 68%, #222A36 68% 100%); display: grid; place-items: center; flex: none; animation: rot 9s linear infinite; }
.ring::after { content: ""; width: 32px; height: 32px; border-radius: 50%; background: #141922; }
@keyframes rot { to { transform: rotate(360deg); } }
.lanes { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.lane { flex: 1; background: #11161E; border-radius: 5px; position: relative; overflow: hidden; }
.lane b { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; background: var(--c); opacity: .55; }
.lane b.mv { animation: slide 6s ease-in-out infinite; opacity: .9; }
@keyframes slide { 0%,30% { left: 6%; } 50%,80% { left: 52%; } 100% { left: 6%; } }
.typing { display: inline-flex; gap: 3px; }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); animation: ty 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes ty { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
.bub { max-width: 70%; height: 14px; border-radius: 7px; background: #1D2430; }
.bub.me { align-self: flex-end; background: var(--c); opacity: .5; }

/* live overlay labels on featured windows */
.toast { position: absolute; right: 12px; bottom: 12px; background: rgba(12,15,20,.9); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 10px; font-size: 11.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; animation: toast 6s ease-in-out infinite; backdrop-filter: blur(6px); }
.toast b { color: var(--ink); font-weight: 600; }
@keyframes toast { 0%,10% { opacity: 0; transform: translateY(6px); } 18%,80% { opacity: 1; transform: none; } 90%,100% { opacity: 0; transform: translateY(6px); } }
.spark { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 10px var(--live); }

/* card meta */
.meta { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.meta .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.cat { font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.badge.live { background: rgba(61,220,151,.12); color: var(--live); }
.badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); animation: ty 1.6s infinite; }
.badge.soon { background: #1B212B; color: var(--ink-3); }
.meta h3 { font: 700 20px/1.15 var(--f-display); letter-spacing: -.015em; }
.featured .meta h3 { font-size: 26px; }
.meta p { color: var(--ink-2); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
.foot .go { color: var(--accent-2); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.card:hover .go svg { transform: translateX(3px); }
.go svg { transition: transform .2s; }

/* filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters button { border: 1px solid var(--line); background: rgba(18,22,29,.7); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px); transition: all .2s; }
.filters button:hover { color: var(--ink); border-color: var(--line-2); }
.filters button.on { background: var(--ink); color: #0A0C10; border-color: var(--ink); }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: rgba(18,22,29,.7); border-radius: 999px; padding: 7px 14px; min-width: 0; }
.search input { background: none; border: 0; outline: 0; color: var(--ink); width: 180px; max-width: 40vw; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
.card.in { animation: rise .6s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* drawer */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,9,.6); backdrop-filter: blur(4px); display: flex; justify-content: flex-end; }
.drawer { width: min(520px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--line); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; animation: slidein .35s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer h3 { font: 700 30px/1.1 var(--f-display); letter-spacing: -.02em; }
.drawer .lbl { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.drawer ul { margin: 0; padding-left: 18px; color: var(--ink-2); }
.drawer ul li + li { margin-top: 4px; }
.close { align-self: flex-end; border: 1px solid var(--line-2); background: none; border-radius: 10px; padding: 6px 12px; font-size: 13px; }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #140700; font-weight: 700; border-radius: 12px; padding: 12px 18px; border: 0; }
.cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-2); }
footer { position: relative; z-index: 1; padding-block: 56px 48px; color: var(--ink-3); font-size: 13px; }

@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } .hero { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 720px) { .featured, .grid { grid-template-columns: minmax(0,1fr); } .top nav { display: none; } .search { margin-left: 0; width: 100%; } .search input { width: 100%; max-width: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* live iframe preview: render the app at desktop size, scaled into the card */
.frame-box { position: relative; flex: 1; overflow: hidden; background: #0C0F14; }
.frame-box iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; background: #fff; }
.frame-cover { position: absolute; inset: 0; }

/* softwares header */
.sw-head { padding-block: 56px 20px; display: flex; flex-direction: column; gap: 12px; }
.sw-title { display: flex; align-items: center; gap: 18px; margin: 0; font: 700 clamp(30px, 4vw, 44px)/1 var(--f-display); letter-spacing: -.02em; color: var(--ink); }
.sw-title .sw-logo { height: clamp(28px, 3.6vw, 40px); width: auto; color: var(--ink); display: block; }
.sw-pipe { width: 2px; align-self: stretch; min-height: 34px; background: var(--line-2); border-radius: 2px; }
.sw-head p { color: var(--ink-3); font-size: 15px; max-width: 62ch; }
/* hero slideshow */
.show { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.show-frame { border: 1px solid var(--line-2); border-radius: 16px; overflow: hidden; background: #0E1117; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 90px rgba(255,106,33,.08); }
.show-bar { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #10141B; border-bottom: 1px solid var(--line); }
.show-bar > i { width: 9px; height: 9px; border-radius: 50%; background: #2E3644; }
.show-url { margin: 0 10px; flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 7px; background: #0B0E13; border: 1px solid var(--line); font: 500 11.5px var(--f-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.show-url .lg-mark { width: 12px; height: 12px; color: var(--ink); flex: none; }
.dlive { font-size: 11px; font-weight: 700; color: var(--live); background: rgba(61,220,151,.12); padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.dlive::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); animation: ty 1.6s infinite; }
.show-stage { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #0B0E13; }
.show-stage .sl { position: absolute; inset: 0; transform: translateX(100%); transition: transform .9s cubic-bezier(.7,0,.2,1); }
.show-stage .sl.on { transform: translateX(0); }
.show-stage .sl.out { transform: translateX(-28%); }
.show-stage .sl.out::after { content: ""; position: absolute; inset: 0; background: rgba(5,6,9,.5); }
.show-stage iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
.show-cap { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.show-name { font: 700 26px/1.1 var(--f-display); letter-spacing: -.02em; margin-top: 4px; }
.show-go { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 14px; white-space: nowrap; transition: color .2s, border-color .2s; }
.show-go:hover { color: var(--ink); border-color: var(--ink-3); }
.show-go .lg-word { height: 12px; width: auto; color: var(--ink); }
.show-prog { display: flex; gap: 6px; }
.show-prog button { flex: 1; height: 3px; border: 0; padding: 0; border-radius: 3px; background: var(--line-2); overflow: hidden; position: relative; }
.show-prog button i { position: absolute; inset: 0; width: 0; background: var(--ink); }
.show-prog button.done i { width: 100%; background: var(--ink-3); }
.show-prog button.on i { animation: fill var(--cycle, 4.5s) linear forwards; }
@keyframes fill { to { width: 100%; } }
.lg-mark { display: block; }

/* dense grid: at least 6 cards in the first screen */
.wrap { max-width: 1400px; }
.sw-head { padding-block: 28px 12px; gap: 16px; flex-direction: row; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.sw-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sw-right .search { margin: 0; width: 280px; max-width: 100%; }
.sw-right .search input { width: 100%; }
.filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; padding: 6px 12px; font-size: 12.5px; }
.search { flex: none; }
#grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
#grid .card { border-radius: 16px; }
#grid .win { margin: 10px 10px 0; border-radius: 10px; aspect-ratio: 16 / 9.6; }
#grid .chrome { height: 20px; }
#grid .chrome .url { height: 12px; font-size: 8.5px; line-height: 12px; }
#grid .meta { padding: 10px 12px 12px; gap: 6px; }
#grid .meta h3 { font-size: 16px; }
#grid .meta p { font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#grid .cat { font-size: 9.5px; }
#grid .badge { font-size: 10.5px; padding: 2px 8px; }
#grid .tags { display: none; }
#grid .foot { font-size: 11px; padding-top: 6px; }
#grid .foot > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#grid .toast { display: none; }
@media (max-width: 1150px) { #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 820px) { #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { #grid { grid-template-columns: minmax(0, 1fr); } }

/* glass cards so the aurora shows through */
#grid .card { background: linear-gradient(180deg, rgba(22,26,36,.66), rgba(12,15,21,.74)); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); border-color: rgba(255,255,255,.08); }
/* card hover: Netflix-style focus + slow camera pan over the app */
#grid { position: relative; }
#grid .card {
  --sx: 50%; --sy: 30%;
  transform-origin: 50% 50%;
  /* leaving: settle back slowly */
  transition: transform .75s cubic-bezier(.22,.61,.36,1), box-shadow .75s cubic-bezier(.22,.61,.36,1),
              border-color .6s ease, opacity .6s ease, filter .6s ease;
  z-index: 1;
}
#grid .card:nth-child(4n+1) { transform-origin: 0% 50%; }
#grid .card:nth-child(4n) { transform-origin: 100% 50%; }
@media (max-width: 1150px) { #grid .card:nth-child(4n+1), #grid .card:nth-child(4n) { transform-origin: 50% 50%; } #grid .card:nth-child(3n+1) { transform-origin: 0% 50%; } #grid .card:nth-child(3n) { transform-origin: 100% 50%; } }
#grid .card:hover {
  z-index: 10;
  transform: scale(1.075) translateY(-6px);
  border-color: rgba(255,170,120,.38);
  box-shadow: 0 40px 80px -24px rgba(0,0,0,.85), 0 18px 40px -18px rgba(255,106,33,.30);
  /* entering: small intent delay, then a confident ease-out */
  transition: transform .55s cubic-bezier(.16,1,.3,1) .12s, box-shadow .55s cubic-bezier(.16,1,.3,1) .12s, border-color .4s ease .12s;
}
/* everything else steps back */
#grid:has(.card:hover) .card:not(:hover) { opacity: .5; filter: saturate(.6) brightness(.85); transition-delay: .12s; }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .6s ease; z-index: 2;
  background: radial-gradient(520px circle at var(--sx) var(--sy), rgba(255,170,120,.08), transparent 55%); }
.card:hover::before { opacity: 1; transition-delay: .12s; }
/* slow camera move across the product preview */
.card .win { overflow: hidden; }
.card .frame-box { transform-origin: 15% 10%; transition: transform .9s cubic-bezier(.22,.61,.36,1); }
.card:hover .frame-box { transform: scale(1.22) translate(-9%, -7%); transition: transform 7s cubic-bezier(.33,0,.2,1) .25s; }
.card .meta h3 { transition: color .4s ease; }
.card:hover .meta h3 { color: #fff; }
.card .go { position: relative; transition: color .3s ease; }
.card .go::after { content: ""; position: absolute; left: 0; right: 18px; bottom: -3px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .45s cubic-bezier(.22,.61,.36,1); }
.card:hover .go { color: #FFB98A; }
.card:hover .go::after { transform: scaleX(1); transition-delay: .25s; }
.card .go svg { transition: transform .45s cubic-bezier(.22,.61,.36,1); }
.card:hover .go svg { transform: translateX(4px); }
/* live (featured) cards: static warm edge, no spinning border */
.card.live::after { display: none; animation: none; }
.card.live { border-color: rgba(255,140,80,.30); }
@media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } #grid .card, .card .frame-box { transition: none !important; } #grid .card:hover { transform: none; } .card:hover .frame-box { transform: none; } #grid:has(.card:hover) .card:not(:hover) { opacity: 1; filter: none; } }
</style>

7837 70.7255 14.2139L73.0098 13.0998C74.101 13.6316 75.417 13.6737 76.5927 13.1003C77.7683 12.527 78.5453 11.464 78.7981 10.2767L81.0823 9.16257ZM14.4575 15.7144L14.4575 4.39991H16.6576L16.6576 5.65708C17.2861 4.7142 18.4794 4.39991 19.8005 4.39991C21.1216 4.39991 22.3148 5.02849 22.9434 5.97137C23.572 5.02849 24.5149 4.39991 26.4006 4.39991C29.0721 4.39991 31.115 6.12852 31.115 8.48571V15.7144H28.915V9.11429C28.915 7.47358 27.8283 6.44281 26.4006 6.44281C24.9304 6.44281 23.8863 7.55881 23.8863 9.11429L23.8863 15.7144H21.6862V9.11429C21.6862 7.47358 20.4637 6.44281 19.0148 6.44281C17.5445 6.44281 16.6576 7.47092 16.6576 9.0264L16.6576 15.7144H14.4575ZM82.9736 4.39992V15.7158H85.1737V9.34687C85.1737 7.74649 86.235 6.59996 87.688 6.59996C89.1199 6.59996 90.1753 7.66226 90.1753 9.34687V15.7158H92.4024V8.84149C92.4024 6.5041 90.7178 4.39991 88.3172 4.39991C86.8432 4.39991 85.7422 4.7516 85.1737 5.65708V4.39992H82.9736ZM66.5568 16.9712C66.1048 19.8213 63.6365 22 60.6592 22C57.682 22 55.2137 19.8213 54.7617 16.9712H57.0061C57.4247 18.598 58.9014 19.8 60.6589 19.8C62.4163 19.8 63.893 18.598 64.3116 16.9712H66.5568ZM54.6878 15.9852L54.6877 16.0285L54.6878 16.0717V15.9852ZM49.6585 5.65732L54.0586 3.45722V5.65732L49.6585 7.85737V15.7145H47.4584V3.77144L49.6585 3.77144V5.65732ZM66.6299 9.70185V3.14235H64.4299V5.1119C63.4016 4.27335 62.0888 3.77051 60.6585 3.77051C57.3605 3.77051 54.687 6.44406 54.687 9.74206C54.687 13.0401 57.3605 15.7136 60.6585 15.7136C63.851 15.7136 66.4583 13.2085 66.6219 10.0568H66.6299V9.78227L66.6301 9.74206L66.6299 9.70185ZM64.4304 9.74282C64.4304 11.8258 62.7418 13.5143 60.6589 13.5143C58.5759 13.5143 56.8874 11.8258 56.8874 9.74282C56.8874 7.65987 58.5759 5.97131 60.6589 5.97131C62.7418 5.97131 64.4304 7.65987 64.4304 9.74282Z"/></svg>${host}</div></div>
      <div class="frame-box"><iframe data-mini="${n.id}" title="${n.name} example screen" tabindex="-1" aria-hidden="true"></iframe><div class="frame-cover"></div></div>${toastHtml}</div>`;
  }
  const toast = n.toast ? `<div class="toast"><span class="spark"></span><span><b>${n.toast[0]}</b> · ${n.toast[1]}</span></div>` : "";
  return `<div class="win" style="--c:${n.c}" aria-hidden="true"><div class="chrome"><i></i><i></i><i></i><div class="url">${n.url || (n.id + ".emergent.host")}</div></div>
    <div class="app"><div class="sb"><div class="lg"></div>${sbItems}</div><div class="cv">${inner}</div></div>${toast}</div>`;
}

function cardHTML(n) {
  const badge = `<span class="badge live">Live</span>`;
  const action = `<span class="go">Open in Emergent ${ARROW}</span>`;
  const inner = `${preview(n)}<div class="meta"><div class="row"><span class="cat">${n.niche}</span>${badge}</div><h3>${n.name}</h3><p>${n.desc}</p><div class="tags">${n.tags.map(t=>`<span>${t}</span>`).join("")}</div><div class="foot"><span>Replaces ${n.replaces}</span>${action}</div></div>`;
  return `<a class="card${n.featured ? " live" : ""}" href="${LINKS[n.id] || PLACEHOLDER}" target="_blank" rel="noopener" data-id="${n.id}" aria-label="Open ${n.name} on Emergent">${inner}</a>`;
}

// featured


// filters + grid
const cats = ["All", ...Array.from(new Set(NICHES.map(n=>n.cat)))];
let active = "All", q = "";
const fEl = document.getElementById("filters");
fEl.innerHTML = cats.map(c=>`<button type="button" data-c="${c}" class="${c==="All"?"on":""}">${c}</button>`).join("") +
  `<label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search a niche" aria-label="Search niches"></label>`;
function renderGrid() {
  const list = NICHES.filter(n => (active==="All" || n.cat===active) && (!q || (n.name+n.niche+n.who+n.tags.join(" ")).toLowerCase().includes(q)));
  const g = document.getElementById("grid");
  g.innerHTML = list.length ? list.map(cardHTML).join("") : `<p style="color:var(--ink-3);grid-column:1/-1;padding:40px 0">No niche matches "${q}". Try "clinic", "salon" or "fleet".</p>`;
  g.querySelectorAll(".card").forEach((el,i)=>{ el.classList.add("in"); el.style.animationDelay = (i*45)+"ms"; });
  if (typeof hydrate === "function") hydrate();
  bindTilt();
}
fEl.addEventListener("click", e => { const b = e.target.closest("button[data-c]"); if (!b) return; active = b.dataset.c; fEl.querySelectorAll("button[data-c]").forEach(x=>x.classList.toggle("on", x===b)); renderGrid(); });
(function(){ const sl = fEl.querySelector(".search"); const host = document.getElementById("sw-search"); if (sl && host) host.appendChild(sl); })();
document.getElementById("q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); renderGrid(); });
renderGrid();

// drawer
const root = document.getElementById("drawer-root");
function openDrawer(n) {
  root.innerHTML = `<div class="scrim" id="scrim"><div class="drawer" role="dialog" aria-modal="true" aria-label="${n.name}">
    <button class="close" id="close" type="button">Close</button>
    ${preview(n)}
    <div><div class="cat">${n.niche}</div><h3 style="margin-top:6px">${n.name}</h3></div>
    <p style="color:var(--ink-2)">${n.desc}</p>
    <div><div class="lbl">Who it's for</div><p>${n.who}</p></div>
    <div><div class="lbl">What's in it</div><ul>${n.tags.map(t=>`<li>${t}</li>`).join("")}<li>Website, customer portal, team logins and roles</li><li>Make it yours: change fields, forms and rules by asking</li></ul></div>
    <div><div class="lbl">Replaces</div><p>${n.replaces}</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:auto"><span class="cta ghost">On the roadmap</span></div>
  </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("close").onclick = close;
  document.getElementById("scrim").onclick = e => { if (e.target.id === "scrim") close(); };
  document.getElementById("close").focus();
  hydrate();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") root.innerHTML = ""; });
document.getElementById("grid").addEventListener("click", e => { const c = e.target.closest("button.card"); if (c) openDrawer(NICHES.find(n=>n.id===c.dataset.id)); });

// fill dummy app iframes
function hydrate() {
  document.querySelectorAll("iframe[data-land]").forEach(f => { if (!f.dataset.done) { f.srcdoc = LANDINGS[f.dataset.land]; f.dataset.done = 1; } });
  document.querySelectorAll("iframe[data-mini]").forEach(f => { if (!f.dataset.done) { f.srcdoc = renderMiniApp(MINI_SPECS[f.dataset.mini]); f.dataset.done = 1; } });
  fitFrames();
}
// scale iframes to fit their cards
function fitFrames() {
  document.querySelectorAll(".frame-box").forEach(b => { const f = b.querySelector("iframe"); if (f) f.style.transform = `scale(${b.clientWidth / 1440})`; });
}
addEventListener("resize", fitFrames); hydrate();

// hero slideshow: templates on Emergent
(function(){
  if (!document.getElementById("s-stage")) return;
  if (!window.LANDINGS) return;
  const ORDER = ["field", "auto", "clinic", "restaurant", "farm", "events", "retail", "hotel", "isp", "store", "church", "salon"].filter(id => LANDINGS[id]);
  const host = slug;
  const stage = document.getElementById("s-stage"), prog = document.getElementById("s-prog");
  const slides = ORDER.map(id => { const d = document.createElement("div"); d.className = "sl"; const f = document.createElement("iframe"); f.tabIndex = -1; f.setAttribute("aria-hidden", "true"); f.title = id; f.srcdoc = LANDINGS[id]; d.appendChild(f); stage.appendChild(d); return d; });
  prog.innerHTML = ORDER.map((id, j) => `<button type="button" aria-label="Show ${(NICHES.find(n => n.id === id) || {}).name}"><i></i></button>`).join("");
  const bars = [...prog.children];
  const fit = () => { const sc = Math.max(stage.clientWidth / 1440, stage.clientHeight / 900); stage.querySelectorAll("iframe").forEach(f => f.style.transform = `scale(${sc})`); };
  addEventListener("resize", fit); fit();
  const CYCLE = 4500; document.getElementById("show").style.setProperty("--cycle", CYCLE + "ms");
  let i = 0, prev = -1, timer;
  function show(k) {
    const n = NICHES.find(x => x.id === ORDER[k]);
    slides.forEach((s, j) => { s.classList.toggle("on", j === k); s.classList.toggle("out", j === prev && j !== k); if (j !== k && j !== prev) s.classList.remove("out"); });
    if (prev >= 0 && prev !== k) { const p = slides[prev]; setTimeout(() => { if (!p.classList.contains("on")) { p.style.transition = "none"; p.classList.remove("out"); p.offsetWidth; p.style.transition = ""; } }, 950); }
    bars.forEach((b, j) => { b.classList.toggle("done", j < k); b.classList.remove("on"); });
    bars[k].offsetWidth; bars[k].classList.add("on");
    document.getElementById("s-url").textContent = host(ORDER[k]);
    document.getElementById("s-name").textContent = n.name;
    document.getElementById("s-niche").textContent = n.niche;
    document.getElementById("s-go").href = LINKS[n.id] || PLACEHOLDER;
    prev = k;
  }
  const restart = () => { clearInterval(timer); if (!reduce) timer = setInterval(() => { i = (i + 1) % ORDER.length; show(i); }, CYCLE); };
  bars.forEach((b, j) => b.addEventListener("click", () => { i = j; show(i); restart(); }));
  slides[0].style.transition = "none"; show(0); slides[0].offsetWidth; slides[0].style.transition = ""; restart();
})();

// tilt
function bindTilt() {
  if (reduce) return;
  document.querySelectorAll(".card").forEach(el => {
    if (el._t) return; el._t = 1;
    el.addEventListener("pointermove", e => { const r = el.getBoundingClientRect(); el.style.setProperty("--sx", ((e.clientX-r.left)/r.width*100)+"%"); el.style.setProperty("--sy", ((e.clientY-r.top)/r.height*100)+"%"); });
  });
}
bindTilt();
window.addEventListener("pointermove", e => { document.documentElement.style.setProperty("--mx", e.clientX+"px"); document.documentElement.style.setProperty("--my", e.clientY+"px"); });

// background: drifting contour field that bends around the cursor
(function(){
  const cv = document.getElementById("field"), ctx = cv.getContext("2d");
  let w, h, dpr, t = 0, mx = -9999, my = -9999;
  function size(){ dpr = Math.min(2, window.devicePixelRatio||1); w = cv.width = innerWidth*dpr; h = cv.height = innerHeight*dpr; }
  size(); addEventListener("resize", size);
  addEventListener("pointermove", e => { mx = e.clientX*dpr; my = e.clientY*dpr; });
  const cols = [[255,122,61],[167,139,250],[45,212,191],[255,92,160]];
  function f(x, y, t){ return Math.sin(x*0.0016 + t*0.6) + Math.cos(y*0.0021 - t*0.4) + Math.sin((x+y)*0.0011 + t*0.3); }
  function frame(){
    ctx.clearRect(0,0,w,h);
    const lines = 26, step = 12*dpr, R = 220*dpr;
    for (let i=0;i<lines;i++){
      ctx.beginPath();
      const base = (i/lines)*h*1.2 - h*0.1;
      for (let x=0; x<=w; x+=step){
        let y = base + f(x, base, t + i*0.05) * 44*dpr;
        const dx = x-mx, dy = y-my, d = Math.hypot(dx, dy);
        if (d < R) { const k = (1 - d/R); y += (dy >= 0 ? 1 : -1) * k*k*60*dpr; }
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      const c = cols[i % cols.length], hot = i % 3 === 0;
      const g = ctx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      g.addColorStop(.5, `rgba(${c[0]},${c[1]},${c[2]},${hot ? .42 : .16})`);
      g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      ctx.strokeStyle = g; ctx.lineWidth = (hot ? 1.6 : 1)*dpr;
      ctx.shadowColor = `rgba(${c[0]},${c[1]},${c[2]},.6)`; ctx.shadowBlur = hot ? 8*dpr : 0;
      ctx.stroke();
    }
    t += 0.005;
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
</script>
